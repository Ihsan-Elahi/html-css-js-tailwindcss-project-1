<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daira Demo | Cart</title>
    <link rel="icon" href="./assets/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./css/style.css?v=2" />
  </head>
  <body>
    <div id="navbar"></div>
    <main id="page-content" class="min-w-0 px-4 py-10 sm:px-6 sm:py-14 lg:px-8">
      <section class="mx-auto max-w-[1200px]" aria-labelledby="cart-heading">
        <nav class="mb-3 text-sm text-circle" aria-label="Breadcrumb">
          <a class="hover:text-primary" href="index.html">Home</a>
          <span aria-hidden="true"> / </span>
          <span aria-current="page">Cart</span>
        </nav>
        <div
          class="mb-7 flex flex-wrap items-end justify-between gap-3 border-b border-circle/20 pb-5"
        >
          <div>
            <p class="mb-1 text-sm font-semibold text-primary">
              Your selection
            </p>
            <h1
              id="cart-heading"
              class="font-display text-5xl font-bold uppercase leading-none text-menu-text sm:text-6xl"
            >
              Shopping Cart
            </h1>
          </div>
          <p data-cart-item-count class="text-sm text-circle">0 items</p>
        </div>

        <div
          id="cart-empty"
          class="rounded-lg border border-circle/20 bg-overlay px-5 py-14 text-center"
        >
          <i
            data-lucide="shopping-basket"
            class="mx-auto mb-4 h-10 w-10 text-circle"
            aria-hidden="true"
          ></i>
          <h2 class="text-lg font-bold text-menu-text">Your cart is empty</h2>
          <p class="mt-2 text-sm text-circle">
            Browse the catalog and add products to get started.
          </p>
          <a
            class="mt-6 inline-flex items-center gap-2 rounded-md bg-primary px-5 py-3 text-sm font-semibold text-white hover:bg-menu-text"
            href="products.html"
          >
            <i data-lucide="arrow-left" class="h-4 w-4" aria-hidden="true"></i>
            Browse Products
          </a>
        </div>

        <div
          id="cart-content"
          class="grid min-w-0 items-start gap-7 lg:grid-cols-[minmax(0,1fr)_300px]"
          hidden
        >
          <div class="min-w-0">
            <div data-cart-items class="space-y-4"></div>
            <a
              class="mt-5 inline-flex items-center gap-2 text-sm font-semibold text-primary hover:text-menu-text"
              href="products.html"
            >
              <i
                data-lucide="arrow-left"
                class="h-4 w-4"
                aria-hidden="true"
              ></i>
              Continue Shopping
            </a>
          </div>
          <aside
            class="rounded-lg border border-circle/20 bg-overlay p-5 sm:p-6"
            aria-labelledby="cart-summary-heading"
          >
            <h2
              id="cart-summary-heading"
              class="text-lg font-bold text-menu-text"
            >
              Order Summary
            </h2>
            <div
              class="mt-5 flex items-center justify-between border-t border-circle/20 pt-4 text-sm"
            >
              <span class="text-circle">Subtotal</span>
              <strong data-cart-total class="text-menu-text">Rs 0</strong>
            </div>
            <p class="mt-3 text-xs leading-5 text-circle">
              Shipping and payment are for demonstration only.
            </p>
            <a
              class="mt-6 inline-flex w-full items-center justify-center gap-2 rounded-md bg-primary px-4 py-3 text-sm font-semibold text-white hover:bg-menu-text"
              href="checkout.html"
            >
              Continue to Checkout
              <i
                data-lucide="arrow-right"
                class="h-4 w-4"
                aria-hidden="true"
              ></i>
            </a>
          </aside>
        </div>
      </section>
    </main>

    <template id="cart-item-template">
      <article
        class="grid min-w-0 grid-cols-[72px_minmax(0,1fr)] gap-3 rounded-lg border border-circle/20 bg-white p-3 sm:grid-cols-[112px_minmax(0,1fr)_auto] sm:items-center sm:gap-5 sm:p-4"
      >
        <img
          data-cart-image
          class="h-[72px] w-[72px] rounded-md object-cover sm:h-28 sm:w-28"
          src=""
          alt=""
        />
        <div class="min-w-0">
          <p
            data-cart-category
            class="text-xs font-semibold uppercase text-primary"
          ></p>
          <h2
            data-cart-name
            class="mt-1 break-words text-sm font-bold text-menu-text sm:text-base"
          ></h2>
          <p data-cart-price class="mt-1 text-sm text-circle"></p>
          <div class="mt-3 flex flex-wrap items-center gap-3">
            <div
              class="inline-flex h-9 items-center rounded border border-circle/30"
            >
              <button
                data-cart-decrease
                class="grid h-8 w-8 place-items-center text-menu-text hover:text-primary"
                type="button"
                aria-label="Decrease quantity"
              >
                <i
                  data-lucide="minus"
                  class="h-3.5 w-3.5"
                  aria-hidden="true"
                ></i>
              </button>
              <input
                data-cart-quantity
                class="h-8 w-10 border-x border-circle/20 text-center text-sm text-menu-text"
                type="number"
                min="1"
                value="1"
                aria-label="Quantity"
              />
              <button
                data-cart-increase
                class="grid h-8 w-8 place-items-center text-menu-text hover:text-primary"
                type="button"
                aria-label="Increase quantity"
              >
                <i
                  data-lucide="plus"
                  class="h-3.5 w-3.5"
                  aria-hidden="true"
                ></i>
              </button>
            </div>
            <button
              data-cart-remove
              class="inline-flex items-center gap-1 text-xs font-semibold text-red-700 hover:underline"
              type="button"
            >
              <i
                data-lucide="trash-2"
                class="h-3.5 w-3.5"
                aria-hidden="true"
              ></i
              >Remove
            </button>
          </div>
        </div>
        <strong
          data-cart-subtotal
          class="col-span-2 text-right text-sm font-bold text-menu-text sm:col-span-1"
        ></strong>
      </article>
    </template>
    <div id="footer"></div>
    <script src="./js/cart.js" defer></script>
    <script src="./js/main.js" defer></script>
  </body>
</html>
