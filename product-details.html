<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Fertilizers | Product Details</title>
  <link rel="icon" href="./assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/tailwind-config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./css/style.css?v=2">
</head>
<body>
  <div id="navbar"></div>
  <main id="page-content" class="min-w-0">
    <section class="px-4 py-8 sm:px-6 sm:py-12 lg:px-8" aria-labelledby="detail-name">
      <div class="mx-auto max-w-[1240px]">
        <nav class="mb-6 text-sm text-circle" aria-label="Breadcrumb">
          <a class="hover:text-primary" href="index.html">Home</a>
          <span aria-hidden="true"> / </span>
          <a class="hover:text-primary" href="products.html">Products</a>
          <span aria-hidden="true"> / </span>
          <span aria-current="page">Product Details</span>
        </nav>

        <div id="product-not-found" class="mx-auto max-w-xl rounded-lg border border-circle/20 bg-overlay px-5 py-14 text-center" hidden>
          <i data-lucide="package-search" class="mx-auto mb-4 h-10 w-10 text-circle" aria-hidden="true"></i>
          <h1 class="font-display text-4xl font-bold uppercase text-menu-text sm:text-5xl">Product not found</h1>
          <p class="mt-3 text-sm leading-6 text-circle">This product is unavailable. Browse the catalog to see current demo products.</p>
          <a class="mt-6 inline-flex items-center gap-2 rounded-md bg-primary px-5 py-3 text-sm font-semibold text-white hover:bg-menu-text" href="products.html">
            <i data-lucide="arrow-left" class="h-4 w-4" aria-hidden="true"></i>
            Back to Products
          </a>
        </div>

        <div id="product-detail" class="min-w-0" hidden>
          <div class="grid min-w-0 gap-8 lg:grid-cols-2 lg:gap-14">
            <div class="min-w-0 overflow-hidden rounded-lg bg-overlay">
              <img id="detail-image" class="aspect-square max-h-[620px] w-full object-cover" src="" alt="">
            </div>
            <div class="min-w-0 py-1 sm:py-4">
              <p id="detail-category" class="text-sm font-semibold uppercase text-primary"></p>
              <h1 id="detail-name" class="mt-2 break-words font-display text-4xl font-bold uppercase leading-tight text-menu-text sm:text-5xl lg:text-6xl"></h1>
              <div class="mt-4 flex flex-wrap items-center gap-2 text-sm text-circle">
                <i data-lucide="star" class="h-4 w-4 fill-current text-secondary" aria-hidden="true"></i>
                <span id="detail-rating"></span>
                <span aria-hidden="true">·</span>
                <span id="detail-stock" class="font-semibold text-primary"></span>
              </div>
              <div class="mt-5 flex flex-wrap items-baseline gap-3">
                <span id="detail-price" class="text-2xl font-bold text-menu-text sm:text-3xl"></span>
                <del id="detail-old-price" class="text-base text-circle" hidden></del>
              </div>
              <p id="detail-description" class="mt-5 max-w-2xl text-base leading-7 text-text"></p>

              <div class="mt-7 flex flex-wrap items-center gap-4">
                <div class="inline-flex h-11 items-center rounded-md border border-circle/30">
                  <button id="quantity-decrease" class="grid h-10 w-10 place-items-center text-menu-text hover:text-primary" type="button" aria-label="Decrease quantity">
                    <i data-lucide="minus" class="h-4 w-4" aria-hidden="true"></i>
                  </button>
                  <input id="detail-quantity" class="h-10 w-12 border-x border-circle/20 text-center text-sm font-semibold text-menu-text outline-none" type="number" min="1" value="1" aria-label="Quantity">
                  <button id="quantity-increase" class="grid h-10 w-10 place-items-center text-menu-text hover:text-primary" type="button" aria-label="Increase quantity">
                    <i data-lucide="plus" class="h-4 w-4" aria-hidden="true"></i>
                  </button>
                </div>
                <button id="detail-add-to-cart" class="inline-flex min-h-11 flex-1 items-center justify-center gap-2 rounded-md bg-primary px-5 py-3 text-sm font-semibold text-white hover:bg-menu-text disabled:cursor-not-allowed disabled:opacity-50 sm:flex-none" type="button">
                  <i data-lucide="shopping-cart" class="h-4 w-4" aria-hidden="true"></i>
                  Add to Cart
                </button>
                <button id="detail-wishlist" class="product-icon-button h-11 w-11" type="button" aria-label="Add to wishlist" aria-pressed="false">
                  <i data-lucide="heart" class="h-5 w-5" aria-hidden="true"></i>
                </button>
              </div>
              <p id="detail-status" class="mt-3 min-h-5 text-sm font-medium text-primary" role="status" aria-live="polite"></p>
              <div class="mt-7 border-t border-circle/20 pt-5 text-sm text-circle">
                <p><span class="font-semibold text-menu-text">Product ID:</span> <span id="detail-product-id"></span></p>
                <p class="mt-2">Demo catalog product · no backend or payment service</p>
              </div>
            </div>
          </div>

          <section class="mt-14 border-t border-circle/20 pt-10" aria-labelledby="related-heading">
            <h2 id="related-heading" class="font-display text-4xl font-bold uppercase text-menu-text sm:text-5xl">Related Products</h2>
            <div id="related-products-grid" class="mt-6 grid min-w-0 grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-3"></div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <template id="product-card-template">
    <article class="min-w-0 overflow-hidden rounded-lg border border-circle/20 bg-white transition-shadow hover:shadow-lg">
      <div class="relative aspect-[4/3] overflow-hidden bg-overlay">
        <img data-product-image class="h-full w-full object-cover" src="" alt="" loading="lazy">
        <span data-featured-badge class="absolute left-3 top-3 rounded bg-secondary px-2.5 py-1 text-xs font-bold text-menu-text" hidden>Featured</span>
        <button data-wishlist-toggle class="product-icon-button absolute right-3 top-3" type="button" aria-label="Add to wishlist" aria-pressed="false"><i data-lucide="heart" class="h-5 w-5" aria-hidden="true"></i></button>
      </div>
      <div class="min-w-0 p-4 sm:p-5">
        <p data-product-category class="mb-1 text-xs font-semibold uppercase text-primary"></p>
        <h3 data-product-name class="min-h-12 text-base font-bold leading-6 text-menu-text"></h3>
        <div class="mt-2 flex items-center gap-1.5 text-sm text-circle"><i data-lucide="star" class="h-4 w-4 fill-current text-secondary" aria-hidden="true"></i><span data-product-rating></span></div>
        <p data-product-description class="mt-3 min-h-16 text-sm leading-6 text-text"></p>
        <p data-product-stock class="mt-3 text-xs font-semibold text-primary"></p>
        <div class="mt-3 flex flex-wrap items-baseline gap-x-2 gap-y-1"><span data-product-price class="text-lg font-bold text-menu-text"></span><del data-product-old-price class="text-sm text-circle" hidden></del></div>
        <div class="mt-4 grid grid-cols-[1fr_auto] gap-2">
          <button data-add-to-cart class="inline-flex min-w-0 items-center justify-center gap-2 rounded-md bg-primary px-3 py-2.5 text-sm font-semibold text-white hover:bg-menu-text disabled:cursor-not-allowed disabled:opacity-50" type="button"><i data-lucide="shopping-cart" class="h-4 w-4 shrink-0" aria-hidden="true"></i><span>Add to Cart</span></button>
          <a data-details-link class="inline-flex min-h-10 min-w-0 items-center justify-center gap-1.5 rounded-md border border-circle/30 px-2 text-xs font-semibold text-menu-text hover:border-primary hover:text-primary sm:text-sm" href="product-details.html"><i data-lucide="eye" class="h-4 w-4" aria-hidden="true"></i><span>View Details</span></a>
        </div>
      </div>
    </article>
  </template>
  <div id="footer"></div>
  <script src="./js/cart.js" defer></script>
  <script src="./js/main.js" defer></script>
  <script src="./js/products.js" defer></script>
</body>
</html>
