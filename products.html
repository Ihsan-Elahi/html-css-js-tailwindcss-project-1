<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Fertilizers | Products</title>
  <link rel="icon" href="./assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/tailwind-config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./css/style.css?v=2">
</head>
<body>
  <div id="navbar"></div>
  <main id="page-content" class="min-w-0">
    <header class="bg-overlay px-4 py-10 sm:px-6 sm:py-14 lg:px-8">
      <div class="mx-auto max-w-[1440px]">
        <nav class="mb-3 text-sm text-circle" aria-label="Breadcrumb">
          <a class="hover:text-primary" href="index.html">Home</a>
          <span aria-hidden="true"> / </span>
          <span aria-current="page">Products</span>
        </nav>
        <p class="mb-2 text-sm font-semibold text-primary">Shop the collection</p>
        <h1 class="font-display text-5xl font-bold uppercase leading-none text-menu-text sm:text-6xl">Our Products</h1>
      </div>
    </header>

    <section class="px-4 py-8 sm:px-6 sm:py-12 lg:px-8" aria-labelledby="catalog-heading">
      <div class="mx-auto grid min-w-0 max-w-[1440px] gap-7 lg:grid-cols-[240px_minmax(0,1fr)] lg:gap-10">
        <aside class="min-w-0" aria-label="Product filters">
          <div class="mb-6">
            <label class="mb-2 block text-sm font-semibold text-menu-text" for="product-search">Search products</label>
            <div class="relative">
              <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-circle" aria-hidden="true"></i>
              <input id="product-search" class="w-full min-w-0 rounded-md border border-circle/30 bg-white py-3 pl-10 pr-3 text-sm text-menu-text outline-none focus:border-primary" type="search" placeholder="Name, category, or description" autocomplete="off">
            </div>
          </div>
          <div class="rounded-lg border border-circle/20 bg-white p-4 sm:p-5">
            <div class="mb-3 flex items-center justify-between gap-3">
              <h2 class="font-semibold text-menu-text">Categories</h2>
              <button id="clear-product-filters" class="text-xs font-semibold text-primary underline-offset-4 hover:underline" type="button">Clear</button>
            </div>
            <div id="category-filters" class="flex flex-wrap gap-2 lg:flex-col" aria-label="Filter by category"></div>
          </div>
        </aside>

        <div class="min-w-0">
          <div class="mb-5 flex min-w-0 flex-col gap-3 border-b border-circle/20 pb-4 sm:flex-row sm:items-center sm:justify-between">
            <div class="min-w-0">
              <h2 id="catalog-heading" class="text-lg font-bold text-menu-text">Agricultural supplies</h2>
              <p id="product-result-count" class="mt-1 text-sm text-circle" aria-live="polite">12 products</p>
            </div>
            <label class="flex min-w-0 items-center gap-2 text-sm text-circle">
              <span class="shrink-0">Sort by</span>
              <select id="product-sort" class="min-w-0 max-w-full rounded-md border border-circle/30 bg-white px-3 py-2.5 text-menu-text outline-none focus:border-primary">
                <option value="default">Default</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="rating">Rating</option>
                <option value="name">Name A-Z</option>
              </select>
            </label>
          </div>

          <p id="product-status" class="mb-4 min-h-5 text-sm font-medium text-primary" role="status" aria-live="polite"></p>
          <div id="product-grid" class="grid min-w-0 grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-3" aria-live="polite"></div>
          <div id="no-products" class="my-12 rounded-lg border border-circle/20 bg-overlay px-4 py-12 text-center" hidden>
            <i data-lucide="search-x" class="mx-auto mb-3 h-8 w-8 text-circle" aria-hidden="true"></i>
            <p class="font-semibold text-menu-text">No products found</p>
            <p class="mt-1 text-sm text-circle">Try another search or category.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <template id="product-card-template">
    <article class="min-w-0 overflow-hidden rounded-lg border border-circle/20 bg-white transition-shadow hover:shadow-lg">
      <div class="relative aspect-[4/3] overflow-hidden bg-overlay">
        <img data-product-image class="h-full w-full object-cover" src="" alt="" loading="lazy">
        <span data-featured-badge class="absolute left-3 top-3 rounded bg-secondary px-2.5 py-1 text-xs font-bold text-menu-text" hidden>Featured</span>
        <button data-wishlist-toggle class="product-icon-button absolute right-3 top-3" type="button" aria-label="Add to wishlist" aria-pressed="false">
          <i data-lucide="heart" class="h-5 w-5" aria-hidden="true"></i>
        </button>
      </div>
      <div class="min-w-0 p-4 sm:p-5">
        <p data-product-category class="mb-1 text-xs font-semibold uppercase text-primary"></p>
        <h3 data-product-name class="min-h-12 text-base font-bold leading-6 text-menu-text"></h3>
        <div class="mt-2 flex items-center gap-1.5 text-sm text-circle" aria-label="Product rating">
          <i data-lucide="star" class="h-4 w-4 fill-current text-secondary" aria-hidden="true"></i>
          <span data-product-rating></span>
        </div>
        <p data-product-description class="mt-3 min-h-16 text-sm leading-6 text-text"></p>
        <p data-product-stock class="mt-3 text-xs font-semibold text-primary"></p>
        <div class="mt-3 flex flex-wrap items-baseline gap-x-2 gap-y-1">
          <span data-product-price class="text-lg font-bold text-menu-text"></span>
          <del data-product-old-price class="text-sm text-circle" hidden></del>
        </div>
        <div class="mt-4 grid grid-cols-[1fr_auto] gap-2">
          <button data-add-to-cart class="inline-flex min-w-0 items-center justify-center gap-2 rounded-md bg-primary px-3 py-2.5 text-sm font-semibold text-white transition hover:bg-menu-text disabled:cursor-not-allowed disabled:opacity-50" type="button">
            <i data-lucide="shopping-cart" class="h-4 w-4 shrink-0" aria-hidden="true"></i>
            <span>Add to Cart</span>
          </button>
          <a data-details-link class="inline-flex min-h-10 min-w-0 items-center justify-center gap-1.5 rounded-md border border-circle/30 px-2 text-xs font-semibold text-menu-text transition hover:border-primary hover:text-primary sm:text-sm" href="product-details.html">
            <i data-lucide="eye" class="h-4 w-4" aria-hidden="true"></i>
            <span>View Details</span>
          </a>
        </div>
      </div>
    </article>
  </template>

  <div id="footer"></div>
  <script src="./js/cart.js" defer></script>
  <script src="./js/main.js" defer></script>
  <script src="./js/products.js" defer></script>
</body>
</html>
